name: PR Agent (Local Ollama)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: self-hosted
    name: Run PR Agent via Docker on Windows self-hosted
    steps:
      - name: PR Agent describe/review/improve
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prUrl = "${{ github.event.pull_request.html_url }}"
          if (-not $prUrl) { Write-Host "no PR url"; exit 0 }
          foreach ($tool in @('describe','review','improve')) {
            Write-Host "=== RUN pr_agent $tool ==="
            docker run --rm `
              --entrypoint python `
              -e GITHUB_TOKEN="$env:GITHUB_TOKEN" `
              -e config.model=ollama/qwen2.5-coder:7b `
              -e config.custom_model_max_tokens=8192 `
              -e OLLAMA.API_BASE=http://host.docker.internal:11434 `
              -e config.ai_timeout=600 `
              pragent/pr-agent:github_action `
              -m pr_agent.cli --pr_url="$prUrl" $tool
            Write-Host "exit=$LASTEXITCODE"
          }
